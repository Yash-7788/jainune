name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: jainune_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install bandit safety

      - name: Verify Python Compilation
        run: |
          python -m compileall backend/app

      - name: Security Scan (SAST)
        run: |
          bandit -r backend/app -ll -q

      - name: Run verification script
        run: |
          python verify_endpoints.py

      - name: Install pgvector in postgres service
        run: |
          CONTAINER=$(docker ps -q --filter "ancestor=postgis/postgis:16-3.4" | head -n 1)
          docker exec $CONTAINER apt-get update -o Acquire::Check-Valid-Until=false
          docker exec $CONTAINER apt-get install -y --no-install-recommends postgresql-16-pgvector

      - name: Run migrations validation
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/jainune_test
        run: |
          cd backend
          python run_migrations.py

      - name: Run unit & integration tests
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/jainune_test
        run: |
          cd backend
          python -m pytest tests/unit tests/integration -v --tb=short

  mobile-check:
    name: Mobile Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: |
          cd mobile
          npm ci --legacy-peer-deps

      - name: TypeScript validation
        run: |
          cd mobile
          npm run type-check

      - name: Dependency Vulnerability Audit
        run: |
          cd mobile
          npm audit --audit-level=critical
