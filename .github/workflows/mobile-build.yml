name: Mobile Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform"
        required: true
        type: choice
        options:
          - all
          - android
          - ios
        default: "android"

jobs:
  build-android:
    if: inputs.platform == 'all' || inputs.platform == 'android'
    name: Build Android Release Bundle (AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: |
          cd mobile
          npm ci --legacy-peer-deps

      - name: Build Android AAB
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-bundle
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  build-ios:
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    name: Build iOS Validation
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: |
          cd mobile
          npm ci --legacy-peer-deps

      - name: Prebuild iOS project
        run: |
          cd mobile
          npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd mobile/ios
          pod install

      - name: Build iOS Workspace (Compilation Check)
        run: |
          cd mobile/ios
          xcodebuild -workspace Jainune.xcworkspace -scheme Jainune -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO clean build
