name: Mobile Compilation Validation

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform"
        required: true
        type: choice
        options:
          - all
          - android
          - ios
        default: "android"

permissions:
  contents: read

jobs:
  build-android:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'
    name: Compile Android (unsigned, not for distribution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: |
          cd mobile
          npm ci --legacy-peer-deps

      - name: Compile unsigned Android AAB
        env:
          EXPO_PUBLIC_WS_URL: ${{ vars.EXPO_PUBLIC_WS_URL || 'wss://api.jainune.com/v1/ws/chat' }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://api.jainune.com/v1' }}
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew bundleRelease -PJAINUNE_ALLOW_UNSIGNED_RELEASE=true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-validation-bundle
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  build-ios:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios'
    name: Compile iOS (unsigned, not an IPA)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: |
          cd mobile
          npm ci --legacy-peer-deps

      - name: Prebuild iOS project & Install CocoaPods
        env:
          EXPO_NO_GIT_STATUS: "1"
        run: |
          cd mobile
          npx expo prebuild --platform ios --clean
          cd ios
          pod install

      - name: Build iOS Workspace (Compilation Check)
        env:
          EXPO_PUBLIC_WS_URL: ${{ vars.EXPO_PUBLIC_WS_URL || 'wss://api.jainune.com/v1/ws/chat' }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://api.jainune.com/v1' }}
        run: |
          cd mobile/ios
          xcodebuild -workspace Jainune.xcworkspace -scheme Jainune -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO clean build
