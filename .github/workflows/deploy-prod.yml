name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      migrate_db:
        description: "Run database migrations before deploy"
        required: true
        type: boolean
        default: true

jobs:
  deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case repo name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/backend:latest
            ghcr.io/${{ env.REPO_LOWER }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Remote Deployment via SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
        if: env.PROD_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/jainune
            export BACKEND_IMAGE="ghcr.io/${{ env.REPO_LOWER }}/backend:${{ github.sha }}"
            docker compose -f backend/docker-compose.prod.yml pull
            if [ "${{ inputs.migrate_db }}" = "true" ]; then
              echo "Reconciling database migrations..."
              docker compose -f backend/docker-compose.prod.yml run --rm api python run_migrations.py
            fi
            docker compose -f backend/docker-compose.prod.yml up -d --remove-orphans
