[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-fail-under=70
markers =
    unit: Pure unit tests (no I/O)
    integration: Integration tests (require live DB + Redis via docker-compose)
    load: Load tests (k6 — not run by pytest)
