version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jainune_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jainune_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jainune_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jainune_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jainune_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"  # N-26: bind to loopback only (0.0.0.0 exposed dev API on LAN)
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-jainune_dev}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # NOTE: Celery worker + beat services removed in v2 zero-cost architecture (native in-process background tasks + pg_cron).

volumes:
  pgdata:
  redisdata:
