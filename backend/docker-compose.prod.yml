version: "3.8"

services:
  api:
    image: ${BACKEND_IMAGE:-ghcr.io/yash-7788/jainune/backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jainune_prod_api
    restart: always
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:8000:8000"
    user: "10001:10001"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

# NOTE: Celery worker + beat services removed (OPTIMIZE.md §3).
# Background tasks now use asyncio in-process tasks in main.py lifespan:
#   - _periodic_maintenance_loop (10-min cycle): subscriptions, matches, matching, impressions, telemetry
#   - _supabase_keepalive_worker (23h cycle): prevents Supabase free-tier auto-pause
# No external worker process needed on Render free tier.
