version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jainune_prod_api
    restart: always
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:8000:8000"
    user: "10001:10001"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jainune_prod_worker
    restart: always
    env_file:
      - .env.production
    command: celery -A app.celery_app worker -B --loglevel=info --concurrency=4 -Q default,notifications,batch
    user: "10001:10001"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
