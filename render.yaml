services:
  - type: web
    name: jainune-backend-api
    runtime: python
    region: singapore # Co-located with the Supabase project
    plan: free
    branch: v2-optimize
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: DATABASE_URL
        sync: false # Supabase Postgres connection string
      - key: DATABASE_POOL_MAX_SIZE
        value: "10"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OTP_PEPPER_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: STORE_WEBHOOK_SECRET
        generateValue: true
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_OTP_TEMPLATE_ID
        sync: false
      - key: CLOUDFLARE_ORIGIN_SECRET
        generateValue: true
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: METRICS_SECRET_TOKEN
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: WEB_PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false # Render Free blocks outbound 587; use a provider-supported port
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FCM_PROJECT_ID
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
