apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"
}

def releaseSigningKeys = ["JAINUNE_RELEASE_STORE_FILE", "JAINUNE_RELEASE_STORE_PASSWORD", "JAINUNE_RELEASE_KEY_ALIAS", "JAINUNE_RELEASE_KEY_PASSWORD"]
def hasReleaseSigning = releaseSigningKeys.every { project.findProperty(it)?.toString()?.trim() }
def allowUnsignedValidation = project.findProperty("JAINUNE_ALLOW_UNSIGNED_RELEASE") == "true"
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains("release") }
            && !hasReleaseSigning && !allowUnsignedValidation) {
        throw new GradleException("Release signing is incomplete. Configure all JAINUNE_RELEASE_* properties. For compilation only, explicitly pass -PJAINUNE_ALLOW_UNSIGNED_RELEASE=true.")
    }
}

/**
 * Jainune Android app build configuration
 *
 * Security hardening:
 * - minifyEnabled: ProGuard/R8 code obfuscation (release only)
 * - shrinkResources: removes unused resources from APK
 * - debuggable: false in release (set automatically by buildType)
 */

android {
    compileSdkVersion 35
    namespace "com.jainune.app"

    defaultConfig {
        applicationId "com.jainune.app"
        minSdkVersion 24       // Android 7.0 — covers 99%+ of current devices
        targetSdkVersion 35    // Android 15; recheck Play requirements before submission.
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Razorpay requires this
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore").exists() ? file("debug.keystore") : file("${System.properties['user.home']}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            // Set these in ~/.gradle/gradle.properties or CI secrets
            // JAINUNE_RELEASE_STORE_FILE, JAINUNE_RELEASE_KEY_ALIAS,
            // JAINUNE_RELEASE_STORE_PASSWORD, JAINUNE_RELEASE_KEY_PASSWORD
            if (hasReleaseSigning) {
                storeFile file(JAINUNE_RELEASE_STORE_FILE)
                storePassword JAINUNE_RELEASE_STORE_PASSWORD
                keyAlias JAINUNE_RELEASE_KEY_ALIAS
                keyPassword JAINUNE_RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        release {
            // Never mark release as debuggable
            debuggable false
            // ── ProGuard/R8 obfuscation ──────────────────────────────────
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Compilation artifacts must never masquerade as store-signed releases.
            signingConfig (hasReleaseSigning ? signingConfigs.release : null)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        pickFirst "**/libc++_shared.so"
        pickFirst "**/libfbjni.so"
        // Exclude debug signing info from release APK
        exclude "META-INF/*.RSA"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.SF"
    }

    splits {
        abi {
            reset()
            enable true
            universalApk true
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")

    // Multidex support for minSdkVersion < 21
    implementation "androidx.multidex:multidex:2.0.1"
}

/* Autolinking — picks up react-native-razorpay, @react-native-google-signin, etc. */
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
