apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

/**
 * Jainune Android app build configuration
 *
 * Security hardening:
 * - minifyEnabled: ProGuard/R8 code obfuscation (release only)
 * - shrinkResources: removes unused resources from APK
 * - debuggable: false in release (set automatically by buildType)
 */

android {
    compileSdkVersion 35
    namespace "com.jainune.app"

    defaultConfig {
        applicationId "com.jainune.app"
        minSdkVersion 24       // Android 7.0 — covers 99%+ of current devices
        targetSdkVersion 35    // Android 15 (Target API 35/36 compliant)
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Razorpay requires this
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            // Set these in ~/.gradle/gradle.properties or CI secrets
            // JAINUNE_RELEASE_STORE_FILE, JAINUNE_RELEASE_KEY_ALIAS,
            // JAINUNE_RELEASE_STORE_PASSWORD, JAINUNE_RELEASE_KEY_PASSWORD
            if (project.hasProperty("JAINUNE_RELEASE_STORE_FILE")) {
                storeFile file(JAINUNE_RELEASE_STORE_FILE)
                storePassword JAINUNE_RELEASE_STORE_PASSWORD
                keyAlias JAINUNE_RELEASE_KEY_ALIAS
                keyPassword JAINUNE_RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        release {
            // Never mark release as debuggable
            debuggable false
            // ── ProGuard/R8 obfuscation ──────────────────────────────────
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        pickFirst "**/libc++_shared.so"
        pickFirst "**/libfbjni.so"
        // Exclude debug signing info from release APK
        exclude "META-INF/*.RSA"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.SF"
    }

    splits {
        abi {
            reset()
            enable true
            universalApk true
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")

    // Multidex support for minSdkVersion < 21
    implementation "androidx.multidex:multidex:2.0.1"
}

react {
    /* Autolinking — picks up react-native-razorpay, @react-native-google-signin, etc. */
    autolinkLibrariesWithApp()
}
